name: build

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Lint
        run: |
          python -m pip install pyflakes
          python -m pyflakes src tests

      - name: Unit tests
        run: |
          python -m pip install -r requirements.txt pytest
          python -m pytest -q tests

      - name: Tag와 version.py 일치 확인
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        run: |
          $v = (python -c "import sys; sys.path.insert(0,'src'); import version; print(version.__version__)").Trim()
          if ("v$v" -ne "${{ github.ref_name }}") { throw "tag ${{ github.ref_name }} != version.py $v" }

      - name: Build (PyInstaller + portable zip + MSIX)
        shell: pwsh
        run: ./scripts/build.ps1 -Msix

      - uses: actions/upload-artifact@v4
        with:
          name: ClaudeSessionKeeper-${{ github.ref_name }}
          path: |
            dist/*.zip
            dist/*.msix

      - name: GitHub Release (포터블 zip만 첨부)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*-portable.zip
          generate_release_notes: true
